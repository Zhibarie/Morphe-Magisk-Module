name: Build Modules

concurrency:
  group: build-modules-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Run cache BDD tests
        run: |
          bash tests/test_cache_bdd.sh
          echo "All 17 cache scenarios passed."

      - name: Resolve versions from config
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          toml_value() {
            awk -v key="$1" '
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*\[/ { in_table = 1; next }
              !in_table && $0 ~ key"=" {
                sub(/^[^=]*=[[:space:]]*/,"")
                gsub(/^"|"$/,"")
                print
                exit
              }
            ' config.toml
          }
          CLI_SRC=$(toml_value cli-source);       CLI_SRC=${CLI_SRC:-MorpheApp/morphe-desktop}
          CLI_VER=$(toml_value cli-version);     CLI_VER=${CLI_VER:-latest}
          PATCHES_SRC=$(toml_value patches-source); PATCHES_SRC=${PATCHES_SRC:-MorpheApp/morphe-patches}
          PATCHES_VER=$(toml_value patches-version); PATCHES_VER=${PATCHES_VER:-latest}

          resolve_tag() {
            local repo="$1" sel="$2" out_json
            local base="https://api.github.com/repos/${repo}/releases"
            case "$sel" in
              latest|stable)
                out_json=$(curl -fsSL -H "Authorization: token ${GH_TOKEN}" "$base/latest")
                ;;
              dev)
                out_json=$(curl -fsSL -H "Authorization: token ${GH_TOKEN}" "$base")
                local picked
                picked=$(jq -r '.[].tag_name' <<<"$out_json" \
                  | awk '{ v=$0; sub(/^v/,"",v); print v"\t"$0 }' \
                  | sort -t$'\t' -k1,1Vr \
                  | head -1 | cut -f2)
                if [ -z "$picked" ] || [ "$picked" = "null" ]; then
                  echo ""
                  return
                fi
                out_json=$(jq -r --arg t "$picked" '.[] | select(.tag_name == $t)' <<<"$out_json")
                ;;
              *)
                local v="${sel#v}"
                out_json=$(curl -fsSL -H "Authorization: token ${GH_TOKEN}" "$base/tags/v${v}")
                ;;
            esac
            local tag asset
            tag=$(jq -r '.tag_name' <<<"$out_json")
            asset=$(jq -r '.assets | map(select(.name | (endswith("asc") or endswith("json")) | not)) | .[0].name' <<<"$out_json")
            echo "$tag $asset"
          }

          CLI_LINE=$(resolve_tag "$CLI_SRC" "$CLI_VER")
          PATCHES_LINE=$(resolve_tag "$PATCHES_SRC" "$PATCHES_VER")
          read -r CLI_TAG CLI_ASSET    <<<"$CLI_LINE"
          read -r PATCHES_TAG PATCHES_ASSET <<<"$PATCHES_LINE"

          if [ -z "$CLI_TAG" ] || [ "$CLI_TAG" = "null" ]; then
            echo "::error::Failed to resolve CLI tag for $CLI_SRC @ $CLI_VER"
            exit 1
          fi
          if [ -z "$PATCHES_TAG" ] || [ "$PATCHES_TAG" = "null" ]; then
            echo "::error::Failed to resolve patches tag for $PATCHES_SRC @ $PATCHES_VER"
            exit 1
          fi

          echo "cli_repo=$CLI_SRC"          >> "$GITHUB_OUTPUT"
          echo "cli_tag=$CLI_TAG"           >> "$GITHUB_OUTPUT"
          echo "cli_asset=$CLI_ASSET"       >> "$GITHUB_OUTPUT"
          echo "patches_repo=$PATCHES_SRC"  >> "$GITHUB_OUTPUT"
          echo "patches_tag=$PATCHES_TAG"   >> "$GITHUB_OUTPUT"
          echo "patches_asset=$PATCHES_ASSET" >> "$GITHUB_OUTPUT"

          CLI_REPO_SAFE=${CLI_SRC//\//-}
          PATCHES_REPO_SAFE=${PATCHES_SRC//\//-}
          echo "cli_repo_safe=$CLI_REPO_SAFE"          >> "$GITHUB_OUTPUT"
          echo "patches_repo_safe=$PATCHES_REPO_SAFE"  >> "$GITHUB_OUTPUT"

          echo "─────────── resolved versions ───────────"
          echo "CLI     : $CLI_SRC @ $CLI_TAG ($CLI_ASSET)"
          echo "Patches : $PATCHES_SRC @ $PATCHES_TAG ($PATCHES_ASSET)"
          echo "──────────────────────────────────────────"

      - name: Cache stock APKs and prebuilts
        id: cache-apks
        uses: actions/cache@v4
        with:
          path: |
            temp
          key: stock-apks-${{ steps.versions.outputs.cli_repo_safe }}-${{ steps.versions.outputs.cli_tag }}-${{ steps.versions.outputs.patches_repo_safe }}-${{ steps.versions.outputs.patches_tag }}-${{ hashFiles('config.toml') }}-${{ github.run_id }}
          restore-keys: |
            stock-apks-${{ steps.versions.outputs.cli_repo_safe }}-${{ steps.versions.outputs.cli_tag }}-${{ steps.versions.outputs.patches_repo_safe }}-${{ steps.versions.outputs.patches_tag }}-${{ hashFiles('config.toml') }}-
            stock-apks-${{ steps.versions.outputs.cli_repo_safe }}-${{ steps.versions.outputs.cli_tag }}-${{ hashFiles('config.toml') }}-
            stock-apks-${{ hashFiles('config.toml') }}-

      - name: Purge stale prebuilts (CI-side hygiene)
        env:
          CLI_ASSET: ${{ steps.versions.outputs.cli_asset }}
          PATCHES_ASSET: ${{ steps.versions.outputs.patches_asset }}
        run: |
          set -euo pipefail
          echo "Expected CLI asset basename    : $CLI_ASSET"
          echo "Expected patches asset basename: $PATCHES_ASSET"

          purge_stale_in() {
            local dir="$1" keep="$2"
            [ -d "$dir" ] || return 0
            [ -n "$keep" ] || return 0
            local kind="${keep%%-[0-9]*}"
            if [ "$kind" = "$keep" ]; then
              echo "  skip: could not derive kind from '$keep' (no -<digit> marker)"
              return 0
            fi
            echo "  scanning: $dir/${kind}-*"
            shopt -s nullglob
            for f in "$dir"/${kind}-*; do
              local b
              b=$(basename "$f")
              if [ "$b" != "$keep" ]; then
                echo "::warning::Purging stale cached artifact: $b (keep: $keep)"
                rm -f "$f"
              fi
            done
            shopt -u nullglob
          }

          [ -d temp/morpheapp-rv ] || mkdir -p temp/morpheapp-rv
          purge_stale_in temp/morpheapp-rv "$CLI_ASSET"
          purge_stale_in temp/morpheapp-rv "$PATCHES_ASSET"

          echo "Pre-flight purge complete."

      - name: Update config
        if: ${{ inputs.from_ci }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 100 --json tagName -q '.[].tagName' \
                | sed -E 's/^(dev|stable)-([0-9]+)$/\2/' \
                | grep -E '^[0-9]+$' \
                | sort -n \
                | tail -1)
          if [ -z "$TAG" ]; then
            TAG=0
            echo "No numeric release tag found, starting from 1"
          else
            echo "Latest numeric tag: $TAG"
          fi
          NEXT_VER_CODE=$((TAG + 1))
          echo "NEXT_VER_CODE=$NEXT_VER_CODE" >> $GITHUB_OUTPUT
          echo "Next version code: $NEXT_VER_CODE"

      - name: Cleanup broken tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list -L 100 --json tagName -q '.[].tagName'); do
            if [[ "$tag" == *"--"* ]]; then
              echo "Removing broken tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Capture previous build.md
        if: ${{ inputs.from_ci }}
        run: |
          if [ -f build.md ]; then
            cp -f build.md build.old.tmp
            echo "Captured previous build.md for version comparison"
          else
            touch build.old.tmp
            echo "No previous build.md found (first build or fresh checkout)"
          fi

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

      - name: Separate dev and stable files
        id: separate
        run: |
          mkdir -p build-dev build-stable
          cd build
          for f in *; do
            if [[ "$f" == *"morphe-dev-"* ]]; then
              mv "$f" ../build-dev/
            elif [[ "$f" == *"morphe-stable-"* ]]; then
              mv "$f" ../build-stable/
            else
              mv "$f" ../build-stable/
            fi
          done
          cd ..
          echo "Dev files:"
          ls -la build-dev/ || echo "(empty)"
          echo ""
          echo "Stable files:"
          ls -la build-stable/ || echo "(empty)"

      - name: Upload STABLE release (marked as Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if [ -n "$(ls -A build-stable 2>/dev/null)" ]; then
            if gh release view "stable-$TAG" >/dev/null 2>&1; then
              gh release edit "stable-$TAG" --title "Stable v$TAG" --notes "$BODY"
              gh release upload "stable-$TAG" build-stable/* --clobber
            else
              gh release create "stable-$TAG" build-stable/* \
                --title "Stable v$TAG" \
                --notes "$BODY" \
                --latest
            fi
            echo "Stable release uploaded"
          else
            echo "No stable files to upload"
          fi

      - name: Upload DEV release (marked as Pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if [ -n "$(ls -A build-dev 2>/dev/null)" ]; then
            if gh release view "dev-$TAG" >/dev/null 2>&1; then
              gh release edit "dev-$TAG" --title "Dev v$TAG (Pre-release)" --notes "$BODY"
              gh release upload "dev-$TAG" build-dev/* --clobber
            else
              gh release create "dev-$TAG" build-dev/* \
                --title "Dev v$TAG (Pre-release)" \
                --notes "$BODY" \
                --prerelease
            fi
            echo "Dev release uploaded"
          else
            echo "No dev files to upload"
          fi

      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          for OUTPUT in build-stable/*module*.zip build-dev/*module*.zip; do
            [ -f "$OUTPUT" ] || continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"

            if [[ "$OUTPUT" == *"morphe-dev-"* ]]; then
              DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/$(basename "$OUTPUT")"
            else
              DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/stable-${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/$(basename "$OUTPUT")"
            fi

            get_update_json "$VER" "$DLURL" >"$UPDATE_JSON"
          done

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build.md *-update.json

          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CLI_TAG: ${{ steps.versions.outputs.cli_tag }}
          PATCHES_TAG: ${{ steps.versions.outputs.patches_tag }}
          BUILD_VER: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
        if: env.TG_TOKEN != null
        run: |
          (
            NL=$'\n'

            # ---- Helper functions ----
            trim() {
              local s="$1"
              s="${s#"${s%%[![:space:]]*}"}"
              s="${s%"${s##*[![:space:]]}"}"
              echo "$s"
            }

            is_link_only() {
              case "$1" in
                \[*\]\(*\)) return 0 ;;
                *) return 1 ;;
              esac
            }

            extract_app_name() {
              local table="$1"
              table="${table%%-Morphe-*}"
              echo "$table"
            }

            # ---- Parse build.tmp into sections ----
            STABLE_VERSIONS=""
            DEV_VERSIONS=""
            CHANGELOG_ENTRIES=""
            SKIPPED_ENTRIES=""
            ADDITIONAL_LINKS=""
            IN_SKIPPED=false

            while IFS= read -r line; do
              line=$(trim "$line")
              [ -z "$line" ] && continue

              case "$line" in
                "### "*) continue ;;
                "Apps:"*) continue ;;
                Skipped:*)
                  IN_SKIPPED=true
                  continue
                  ;;
              esac

              if [ "$IN_SKIPPED" = true ]; then
                if ! is_link_only "$line"; then
                  SKIPPED_ENTRIES+="${NL}- ${line:0:120}"
                fi
                continue
              fi

              # App version lines (contain "-Morphe-" and ":")
              if [[ "$line" == *"-Morphe-"*":"* ]]; then
                table_name="${line%%:*}"
                table_name="${table_name%% (*}"
                table_name=$(trim "$table_name")
                version="${line##*:}"
                version=$(trim "$version")
                app_name=$(extract_app_name "$table_name")
                [ -z "$version" ] && continue

                case "$table_name" in
                  *-Stable) STABLE_VERSIONS+="${NL}${app_name} ${version}" ;;
                  *-Dev)    DEV_VERSIONS+="${NL}${app_name} ${version}" ;;
                esac
                CHANGELOG_ENTRIES+="${NL}- ${line:0:120}"
                continue
              fi

              # Markdown link-only lines
              if is_link_only "$line"; then
                case "$line" in
                  "[Changelog]"*) continue ;;
                esac
                ADDITIONAL_LINKS+="${NL}- ${line:0:200}"
                continue
              fi

              # Instruction lines with inline markdown links
              if [[ "$line" =~ \[.*\]\(.*\) ]]; then
                ADDITIONAL_LINKS+="${NL}- ${line:0:200}"
                continue
              fi

              # Skip artifact metadata (Patches:/CLI:)
              case "$line" in
                Patches:*|CLI:*) continue ;;
              esac

              # Unknown informative line → keep in changelog
              CHANGELOG_ENTRIES+="${NL}- ${line:0:120}"
            done < build.tmp

            STABLE_VERSIONS=${STABLE_VERSIONS#"$NL"}
            DEV_VERSIONS=${DEV_VERSIONS#"$NL"}
            CHANGELOG_ENTRIES=${CHANGELOG_ENTRIES#"$NL"}
            SKIPPED_ENTRIES=${SKIPPED_ENTRIES#"$NL"}
            ADDITIONAL_LINKS=${ADDITIONAL_LINKS#"$NL"}

            # ---- Deduplicate channel versions by app name ----
            dedupe_versions() {
              local input="$1" seen="" result=""
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                local app="${line%% *}"
                if ! grep -q "^${app}$" <<<"$seen" 2>/dev/null; then
                  seen+="${app}"$'\n'
                  result+="${line}"$'\n'
                fi
              done <<<"$input"
              result=$(trim "$result")
              echo "$result"
            }

            STABLE_VERSIONS=$(dedupe_versions "$STABLE_VERSIONS")
            DEV_VERSIONS=$(dedupe_versions "$DEV_VERSIONS")

            # ---- Build Upgrade section (compare old vs new) ----
            UPGRADE_ENTRIES=""
            if [ -f build.old.tmp ]; then
              declare -A OLD_VERSIONS NEW_VERSIONS

              while IFS= read -r line; do
                line=$(trim "$line")
                [ -z "$line" ] && continue
                if [[ "$line" == *"-Morphe-"*":"* ]]; then
                  table_name="${line%%:*}"
                  table_name="${table_name%% (*}"
                  table_name=$(trim "$table_name")
                  version="${line##*:}"
                  version=$(trim "$version")
                  app_name=$(extract_app_name "$table_name")
                  [ -z "$version" ] && continue
                  [ -z "${OLD_VERSIONS[$app_name]:-}" ] && OLD_VERSIONS[$app_name]="$version"
                fi
              done < build.old.tmp

              while IFS= read -r line; do
                line=$(trim "$line")
                [ -z "$line" ] && continue
                if [[ "$line" == *"-Morphe-"*":"* ]]; then
                  table_name="${line%%:*}"
                  table_name="${table_name%% (*}"
                  table_name=$(trim "$table_name")
                  version="${line##*:}"
                  version=$(trim "$version")
                  app_name=$(extract_app_name "$table_name")
                  [ -z "$version" ] && continue
                  [ -z "${NEW_VERSIONS[$app_name]:-}" ] && NEW_VERSIONS[$app_name]="$version"
                fi
              done < build.tmp

              for app in "${!NEW_VERSIONS[@]}"; do
                new_ver="${NEW_VERSIONS[$app]}"
                old_ver="${OLD_VERSIONS[$app]:-}"
                if [ -n "$old_ver" ] && [ "$old_ver" != "$new_ver" ]; then
                  UPGRADE_ENTRIES+="${NL}- ${app}: ${old_ver} → ${new_ver}"
                fi
              done
              UPGRADE_ENTRIES=${UPGRADE_ENTRIES#"$NL"}
            fi

            # ---- Build Stable Downloads ----
            STABLE_COUNT=0
            STABLE_DOWNLOADS=""
            if [ -d build-stable ]; then
              for f in build-stable/*; do
                [ -f "$f" ] || continue
                case "$f" in *.apk|*.zip) ;; *) continue ;; esac
                STABLE_COUNT=$((STABLE_COUNT + 1))
                bn=$(basename "$f")
                url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/stable-${BUILD_VER}/${bn}"
                printf -v dl_line '\n- [%s](%s)' "$bn" "$url"
                STABLE_DOWNLOADS+="$dl_line"
              done
            fi
            STABLE_DOWNLOADS=${STABLE_DOWNLOADS#"$NL"}

            # ---- Build Dev Downloads ----
            DEV_COUNT=0
            DEV_DOWNLOADS=""
            if [ -d build-dev ]; then
              for f in build-dev/*; do
                [ -f "$f" ] || continue
                case "$f" in *.apk|*.zip) ;; *) continue ;; esac
                DEV_COUNT=$((DEV_COUNT + 1))
                bn=$(basename "$f")
                url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/dev-${BUILD_VER}/${bn}"
                printf -v dl_line '\n- [%s](%s)' "$bn" "$url"
                DEV_DOWNLOADS+="$dl_line"
              done
            fi
            DEV_DOWNLOADS=${DEV_DOWNLOADS#"$NL"}

            # ---- Determine header status ----
            LIMITED=false
            [ -z "$BUILD_VER" ] && LIMITED=true
            [ -z "$CLI_TAG" ] && LIMITED=true
            [ -z "$PATCHES_TAG" ] && LIMITED=true
            [ "$STABLE_COUNT" -eq 0 ] && [ "$DEV_COUNT" -eq 0 ] && LIMITED=true

            if [ "$LIMITED" = true ]; then
              HEADER="Morphe build completed with limited information"
            else
              HEADER="Morphe build complete"
            fi

            # ---- Assemble message ----
            MSG=""
            MSG+="${HEADER}${NL}${NL}"

            [ -n "$STABLE_VERSIONS" ]  && MSG+="*Stable*${NL}${STABLE_VERSIONS}${NL}${NL}"
            [ -n "$DEV_VERSIONS" ]     && MSG+="*Dev*${NL}${DEV_VERSIONS}${NL}${NL}"
            [ -n "$CHANGELOG_ENTRIES" ] && MSG+="*Changelog*${NL}${CHANGELOG_ENTRIES}${NL}${NL}"
            [ -n "$UPGRADE_ENTRIES" ]  && MSG+="*Upgrade*${NL}${UPGRADE_ENTRIES}${NL}${NL}"
            [ -n "$SKIPPED_ENTRIES" ]  && MSG+="*Skipped*${NL}${SKIPPED_ENTRIES}${NL}${NL}"
            [ -n "$STABLE_DOWNLOADS" ] && MSG+="*Stable Downloads*${NL}${STABLE_DOWNLOADS}${NL}${NL}"
            [ -n "$DEV_DOWNLOADS" ]    && MSG+="*Dev Downloads*${NL}${DEV_DOWNLOADS}${NL}${NL}"
            [ -n "$ADDITIONAL_LINKS" ] && MSG+="*Additional*${NL}${ADDITIONAL_LINKS}"

            MSG="${MSG%"${NL}"}"
            MSG="${MSG%"${NL}"}"

            # ---- Send to Telegram ----
            POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
            for attempt in 1 2 3; do
              RESPONSE=$(curl -sS --max-time 10 -X POST \
                --data-urlencode "parse_mode=Markdown" \
                --data-urlencode "disable_web_page_preview=true" \
                --data-urlencode "text=${MSG:0:4096}" \
                --data-urlencode "chat_id=1067754962" \
                "$POST")
              if echo "$RESPONSE" | grep -q '"ok":true'; then
                echo "Telegram notif sent (attempt $attempt)"
                break
              fi
              echo "Attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
          ) &
          echo "Telegram notification dispatched in background"

      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up releases older than the latest 10 (both dev and stable)..."
          OLD_TAGS=$(gh release list -L 100 --json tagName -q '.[].tagName' | tail -n +21)
          if [ -z "$OLD_TAGS" ]; then
            echo "No old releases to clean."
          else
            for tag in $OLD_TAGS; do
              echo "Deleting release $tag..."
              gh release delete "$tag" --yes --cleanup-tag || true
            done
          fi
