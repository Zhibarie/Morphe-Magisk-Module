enable-module-update = true
parallel-jobs = 1

# ============================================================
# DUAL BUILD CONFIG: DEV (prerelease) + STABLE (release)
# ============================================================
# Setiap build akan menghasilkan 2 versi per aplikasi:
# - Dev:    Patch terbaru (mungkin ada bug, fitur eksperimental)
# - Stable: Patch stabil (teruji, lebih reliable)
#
# User bisa pilih sendiri mau pakai yang mana.
# Keduanya bisa coexist (install bersamaan) karena module-prop-name beda.
# ============================================================


# ===== YOUTUBE - DEV (Prerelease) =====
[YouTube-Morphe-Dev]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
patches-version = "dev"
rv-brand = "Morphe-Dev"
build-mode = "both"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
module-prop-name = "youtube-morphe-dev"


# ===== YOUTUBE - STABLE (Release) =====
[YouTube-Morphe-Stable]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
patches-version = "latest"
rv-brand = "Morphe"
build-mode = "both"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
module-prop-name = "youtube-morphe-stable"


