enable-module-update = true
parallel-jobs = 1
compression-level = 9
remove-rv-integrations-checks = true

# ---- Centralized source/version defaults ----
# Any [App-X] section that does NOT override these inherits them.
cli-source      = "MorpheApp/morphe-desktop"
cli-version     = "latest"

patches-source  = "MorpheApp/morphe-patches"
patches-version = "latest"

rv-brand        = "Morphe"

# Cache policy is configured via env vars in .github/workflows/build.yml
# (see CACHE_RETENTION_COUNT, CACHE_FALLBACK_ALLOWED, etc.)

# ---------- YouTube (Dev / Prerelease) ----------
[YouTube-Morphe-Dev]
app-name          = "YouTube"
patches-version   = "dev"
rv-brand          = "Morphe-Dev"
build-mode        = "both"
apkmirror-dlurl   = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl    = "https://youtube.en.uptodown.com/android"
archive-dlurl     = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
module-prop-name  = "youtube-morphe-dev"

# ---------- YouTube (Stable / Release) ----------
[YouTube-Morphe-Stable]
app-name          = "YouTube"
patches-version   = "stable"
rv-brand          = "Morphe"
build-mode        = "both"
apkmirror-dlurl   = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl    = "https://youtube.en.uptodown.com/android"
archive-dlurl     = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
module-prop-name  = "youtube-morphe-stable"

# ---------- YouTube Music (Dev / Prerelease) ----------
[Music-Morphe-Dev]
app-name          = "Music"
patches-version   = "dev"
rv-brand          = "Morphe-Dev"
build-mode        = "both"
arch              = "both"
apkmirror-dlurl   = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl    = "https://youtube-music.en.uptodown.com/android"
archive-dlurl     = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
module-prop-name  = "music-morphe-dev"

# ---------- YouTube Music (Stable / Release) ----------
[Music-Morphe-Stable]
app-name          = "Music"
patches-version   = "stable"
rv-brand          = "Morphe"
build-mode        = "both"
arch              = "both"
apkmirror-dlurl   = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl    = "https://youtube-music.en.uptodown.com/android"
archive-dlurl     = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
module-prop-name  = "music-morphe-stable"
